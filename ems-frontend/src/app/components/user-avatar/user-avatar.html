<div class="relative">
  <div class="w-10 h-10 rounded-full flex items-center justify-center
              bg-gradient-to-r from-cyan-500 to-blue-500 text-white cursor-pointer" (click)="togglePopover()">
    {{ initials() }}
  </div>

  @if(isPopoverOpen){
  <div class="absolute top-11 right-0 bg-white border border-gray-300 rounded-md shadow-lg p-4 z-10 min-w-48">
    <div class="text-sm ml-2 text-gray-700 mb-2">{{ user() }}</div>
    <button class=" flex gap-2 w-full text-left text-sm text-gray-700 hover:bg-gray-100 px-2 py-1 rounded" (click)="onSignOut()">
      <mat-icon>logout</mat-icon> Sign Out
    </button>
  </div>
  }
</div>
